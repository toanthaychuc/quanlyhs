<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Hệ thống Quản lý Học tập Toán Thầy Công Chức" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>Toán thầy Công Chức</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var fontScale = localStorage.getItem('app_font_scale') || '100';
          document.documentElement.style.setProperty('--app-font-scale', fontScale + '%');
          document.documentElement.style.setProperty('--app-font-scale-mobile', (Number(fontScale) * 0.8).toFixed(1) + '%');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
