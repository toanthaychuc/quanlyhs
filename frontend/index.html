<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#060913" />
    <meta name="description" content="Hệ thống Quản lý Học tập Toán Thầy Công Chức" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>Toán thầy Công Chức</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var fontScale = localStorage.getItem('app_font_scale') || '100';
          document.documentElement.style.setProperty('--app-font-scale', fontScale + '%');
          document.documentElement.style.setProperty('--app-font-scale-mobile', (Number(fontScale) * 0.8).toFixed(1) + '%');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Khởi tạo màu nền tối tức thì tránh nháy sáng hoặc lộ màn hình chính */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #060913;
      }
    </style>
  </head>
  <body style="margin: 0; background-color: #060913;">
    <div id="root">
      <!-- Màn hình chào mừng sơ khởi hiển thị tức thì 0ms trước khi React tải xong -->
      <div id="initial-loading-splash" style="position: fixed; inset: 0; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #060913; background-image: radial-gradient(circle at 50% 50%, rgba(30, 27, 75, 0.6) 0%, rgba(6, 9, 19, 0.98) 75%); user-select: none;">
        <div style="width: 108px; height: 108px; border-radius: 28px; background: linear-gradient(135deg, #4f46e5 0%, #2563eb 50%, #06b6d4 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 36px -6px rgba(79, 70, 229, 0.55), 0 0 0 1.5px rgba(255, 255, 255, 0.35) inset, 0 0 30px rgba(6, 182, 212, 0.3); margin-bottom: 1.5rem;">
          <span style="font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 3.4rem; font-weight: 900; color: #ffffff; letter-spacing: -0.04em;">LC</span>
        </div>
        <h1 style="margin: 0 0 0.4rem 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 1.75rem; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Toán thầy Công Chức</h1>
        <p style="margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 0.95rem; font-weight: 500; color: #94a3b8; letter-spacing: 0.03em;">Kỷ luật mỗi ngày · Làm chủ phòng thi</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
